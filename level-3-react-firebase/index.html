<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Level 3 - React & Firebase Admin Portal</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; }
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: #1e293b; padding: 24px; border-right: 1px solid #334155; }
    .main { flex: 1; padding: 32px; }
    .nav-item { padding: 12px 16px; color: #94a3b8; border-radius: 6px; margin-bottom: 8px; cursor: pointer; }
    .nav-item.active { background: #0284c7; color: white; font-weight: 600; }
    .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }
    .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 10px; }
    .card h3 { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
    .card .val { font-size: 28px; font-weight: 700; color: #38bdf8; }
    .btn { background: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn:hover { background: #7dd3fc; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    function Dashboard() {
      const [user, setUser] = React.useState({ loggedIn: false, email: '' });
      const [tickets, setTickets] = React.useState([
        { id: 101, title: 'Database Index Optimization', priority: 'High', status: 'Open' },
        { id: 102, title: 'Firebase OAuth Migration', priority: 'Medium', status: 'In Progress' }
      ]);

      const handleLogin = () => {
        setUser({ loggedIn: true, email: 'admin@system.io' });
      };

      const handleLogout = () => {
        setUser({ loggedIn: false, email: '' });
      };

      return (
        <div className="layout">
          <div className="sidebar">
            <h2 style={{fontSize: '18px', color: '#38bdf8', marginBottom: '24px'}}>FIREBASE ADMIN</h2>
            <div className="nav-item active">Dashboard</div>
            <div className="nav-item">Firestore Sync</div>
            <div className="nav-item">Auth Settings</div>
          </div>

          <div className="main">
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '24px'}}>
              <h2>System Operations Hub</h2>
              {user.loggedIn ? (
                <div>
                  <span style={{marginRight: '12px', color: '#94a3b8'}}>{user.email}</span>
                  <button className="btn" style={{background: '#ef4444', color: 'white'}} onClick={handleLogout}>Logout</button>
                </div>
              ) : (
                <button className="btn" onClick={handleLogin}>Authenticate Firebase</button>
              )}
            </div>

            <div className="card-grid">
              <div className="card">
                <h3>ACTIVE SESSIONS</h3>
                <div className="val">{user.loggedIn ? '1,284' : '0'}</div>
              </div>
              <div className="card">
                <h3>FIRESTORE READS</h3>
                <div className="val">48.2k</div>
              </div>
              <div className="card">
                <h3>CLOUD LATENCY</h3>
                <div className="val" style={{color: '#4ade80'}}>24ms</div>
              </div>
            </div>

            <div className="card">
              <h3 style={{marginBottom: '16px', color: '#f8fafc', fontSize: '16px'}}>Realtime Support Queue</h3>
              <table style={{width: '100%', textAlign: 'left', borderCollapse: 'collapse'}}>
                <thead>
                  <tr style={{borderBottom: '1px solid #334155', color: '#94a3b8', fontSize: '13px'}}>
                    <th style={{padding: '8px'}}>ID</th>
                    <th style={{padding: '8px'}}>Issue Title</th>
                    <th style={{padding: '8px'}}>Priority</th>
                    <th style={{padding: '8px'}}>Status</th>
                  </tr>
                </thead>
                <tbody>
                  {tickets.map(t => (
                    <tr key={t.id} style={{borderBottom: '1px solid #334155'}}>
                      <td style={{padding: '12px 8px'}}>{t.id}</td>
                      <td style={{padding: '12px 8px'}}>{t.title}</td>
                      <td style={{padding: '12px 8px', color: t.priority === 'High' ? '#f87171' : '#facc15'}}>{t.priority}</td>
                      <td style={{padding: '12px 8px'}}>{t.status}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Dashboard />);
  </script>
</body>
</html>
